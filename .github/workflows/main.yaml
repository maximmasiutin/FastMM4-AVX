          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-Co', '-Cr', '-dSoftInvalidFreeMem', '-dAlwaysClearFreedMemory', '-dDontUseASMVersion', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'SoftInvalidFreeMemTest.dpr')
          & '.\SoftInvalidFreeMemTest.exe'

      - name: Compile and run SoftInvalidFreeMemTest 32-bit (ASM, AlwaysClearFreedMemory)
