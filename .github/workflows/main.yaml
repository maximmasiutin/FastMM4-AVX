          cd $Env:GITHUB_WORKSPACE/Tests/Advanced
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin32', '-Pi386', '-Co', '-Cr', '-dDontUseASMVersion', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'AdvancedTest.dpr')
          & '.\AdvancedTest.exe'

      - name: Compile and run AdvancedTest 64-bit (overflow+range checks, SoftInvalidFreeMem)
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Advanced
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-Co', '-Cr', '-dSoftInvalidFreeMem', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'AdvancedTest.dpr')
          & '.\AdvancedTest.exe'

      # =========================================================================
      # FPU stack regression - Windows
      # Guards the x87 stack corruption fixed in the 32-bit fixed size move
      # routines Move36 to Move68 (pleriche/FastMM4 issue 85). Only the
      # -dDisable32BitSSE build reaches the repaired routines: an SSE capable
      # host, which every runner is, otherwise installs the separate
      # Move36_32BIT_SSE family, and that build passes whether or not the fix
      # is present. The other two configurations are run as coverage of the SSE
      # family and of the 64-bit skip, not as the regression check.
      #
      # The three configurations build the same executable name in the same
      # directory, so each step deletes the previous one before compiling and
      # stops on the compiler's exit code. Without both, a compilation that
      # failed would leave the earlier configuration's executable in place, the
      # step would run that instead, and its zero exit code would become the
      # step's: the shell wrapper checks $LASTEXITCODE once, after the whole
      # script, so the compiler's code is overwritten by the run that follows.
      # =========================================================================
      - name: Compile and run FpuStackTest 32-bit (plain movers, guards issue 85)
        timeout-minutes: 2
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Simple
          Remove-Item -Force -ErrorAction Ignore .\FpuStackTest.exe
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin32', '-Pi386', '-dDisable32BitSSE', '-O4', 'FpuStackTest.dpr')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\FpuStackTest.exe'

      - name: Compile and run FpuStackTest 32-bit (SSE movers)
        timeout-minutes: 2
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Simple
          Remove-Item -Force -ErrorAction Ignore .\FpuStackTest.exe
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin32', '-Pi386', '-O4', 'FpuStackTest.dpr')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\FpuStackTest.exe'

      - name: Compile and run FpuStackTest 64-bit (reports that it skipped)
        timeout-minutes: 2
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Simple
          Remove-Item -Force -ErrorAction Ignore .\FpuStackTest.exe
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-O4', 'FpuStackTest.dpr')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\FpuStackTest.exe'
