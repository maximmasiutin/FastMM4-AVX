          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-dIgnoreMemoryAllocatedBefore', '-dFullDebugMode', '-dNoMessageBoxes', '-O4', 'IntegerOverflowTest.dpr')
