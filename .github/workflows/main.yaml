          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin32', '-Pi386', '-Co', '-Cr', '-dSoftInvalidFreeMem', '-dDontUseASMVersion', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'SoftInvalidFreeMemTest.dpr')
          & '.\SoftInvalidFreeMemTest.exe'

      # SoftInvalidFreeMem + AlwaysClearFreedMemory variants. Exercise the
      # ClearSmall / ClearMedium FillChar guard ordering (issue #39 findings
      # 4 and 5, PRs #60 / #61). These code paths only compile when
      # ClearSmallAndMediumBlocksInFreeMem is active. Covers 32-bit ASM,
      # 64-bit ASM, and Pure Pascal paths.
      - name: Compile and run SoftInvalidFreeMemTest 64-bit (ASM, AlwaysClearFreedMemory)
        timeout-minutes: 2
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Simple
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-Co', '-Cr', '-dSoftInvalidFreeMem', '-dAlwaysClearFreedMemory', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'SoftInvalidFreeMemTest.dpr')
          & '.\SoftInvalidFreeMemTest.exe'

