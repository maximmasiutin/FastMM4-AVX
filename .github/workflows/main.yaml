          cd $Env:GITHUB_WORKSPACE/Tests/Simple
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin32', '-Pi386', '-Co', '-Cr', '-dSoftInvalidFreeMem', '-dAlwaysClearFreedMemory', '-dDontUseASMVersion', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'SoftInvalidFreeMemTest.dpr')
          & '.\SoftInvalidFreeMemTest.exe'

      # =========================================================================
      # Overflow and Range Check Tests - Windows
      # Verify that normal allocator operations work under strict checking.
      # =========================================================================
      - name: Compile and run AdvancedTest 64-bit (overflow+range checks, ASM)
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Advanced
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-Co', '-Cr', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'AdvancedTest.dpr')
          & '.\AdvancedTest.exe'

      - name: Compile and run AdvancedTest 64-bit (overflow+range checks, Pure Pascal)
        run: |
          cd $Env:GITHUB_WORKSPACE/Tests/Advanced
          & '${{ env.fpc }}' @('-B', '-Mdelphi', '-Twin64', '-Px86_64', '-Co', '-Cr', '-dDontUseASMVersion', '-dIgnoreMemoryAllocatedBefore', '-dDisableMemoryLeakReporting', '-O4', 'AdvancedTest.dpr')
          & '.\AdvancedTest.exe'

